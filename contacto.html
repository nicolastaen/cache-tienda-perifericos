<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
        <header>
            <nav>
                <div class="navbar">
                    <a href="index.html">
                        <img src="imagenes/Cachelogo.png" alt="logo">
                    </a>
                </div>

                <form class="search-box">
                    <input type="text" placeholder="Buscar algo" name="buscar" required>
                </form>

                <div class="nav-derecha">
                    <a href="carrito.html" class="nav-carrito">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">

                    <div class="login">

                    </div>
                </div>
            </nav>
        </header>
    <div class="formulario">
        <div class = "formulario-contacto">
            <h1>formulario de contacto</h1>
            <form class="cdr-contacto">
                <div class="campo">
                    <label for="">Correo electrónico </label>
                    <input type="text" placeholder="*" class="" required>
                </div>
                <div class="campo">
                    <label for="">Direccion</label>
                    <input type="text" placeholder="*" class="" required>
                </div>
                <div class="campo">
                    <label for="">Mensaje</label>
                    <textarea type="text" placeholder="*" class="" required>
                    </textarea>
                </div>
                <button type="submit">
                    Enviar
                </button>
            </form>
        </div>
    </div>
    
</body>
</html>
