<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito - Caché</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main>
        <header>
            <nav>
                <div class="navbar">
                    <a href="index.html">
                        <img src="imagenes/Cachelogo.png" alt="logo">
                    </a>
                </div>

                <form class="search-box">
                    <input type="text" placeholder="Buscar algo" name="buscar" required>
                </form>

                <div class="nav-derecha">
                    <a href="carrito.html" class="nav-carrito">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="carrito-badge" id="contador-carrito">0</span>
                    </a>

                    <div class="login">
                        <a href="login.html">INICIAR SESIÓN</a>
                    </div>
                </div>
            </nav>
        </header>

        <section class="carrito-seccion">
            <h1 class="carrito-titulo">Mi carrito de compras</h1>

            <div class="carrito-contenedor" id="carrito-contenedor">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </section>

    </main>

    <footer>
        <div class="footer1">
            <div class="pie-pagina">
                <img src="imagenes/Cachelogo.png" alt="logo">
            </div>
            <div class="pie-pagina">
                <a href="sobre-nosotros.html">Sobre nosotros</a>
            </div>
            <div class="pie-pagina">
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
        <div class="footer2">
            hola
        </div>
    </footer>

    <script src="js/carrito.js"></script>
    <script src="js/carrito-vista.js"></script>
</body>
</html>
