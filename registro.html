<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Caché</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        /* Esta página no tiene header fijo, así que anulamos el margin-top global del body */
        body{
            margin-top: 0;
        }
    </style>
</head>
<body>
    <main>
        <section class="login-section">
            <div class="login-box registro-box">
                <h1>Crea tu cuenta</h1>
                <p class="login-subtitulo">Regístrate para empezar a comprar en Caché</p>

                <form class="login-form" id="form-registro">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="Crea una contraseña" minlength="6" required>

                    <label for="clave2">Confirmar contraseña</label>
                    <input type="password" id="clave2" name="clave2" placeholder="Repite tu contraseña" minlength="6" required>

                    <label class="check-terminos">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        Acepto los términos y condiciones
                    </label>

                    <button type="submit" class="btn-login">Crear cuenta</button>
                </form>

                <div class="separador">
                    <span>o</span>
                </div>

                <p class="registro-texto">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </p>
            </div>
        </section>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>
