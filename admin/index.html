<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrador - Caché</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <style>body{ margin-top: 0; }</style>
</head>
<body data-pagina-admin="home">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <img src="../imagenes/Cachelogo.png" alt="logo">
                <span>Panel Caché</span>
            </div>

            <a href="index.html" class="admin-nav-link activo">🏠 Inicio</a>
            <a href="productos.html" class="admin-nav-link">📦 Productos</a>
            <a href="usuarios.html" class="admin-nav-link" data-solo-admin>👤 Usuarios</a>

            <a href="#" class="admin-nav-salir" id="btn-cerrar-sesion">↩ Cerrar sesión</a>
        </aside>

        <div class="admin-contenido">
            <div class="admin-header">
                <h1>¡Hola, <span id="nombre-usuario">Administrador</span>!</h1>
            </div>

            <div class="admin-tarjetas">
                <div class="admin-tarjeta">
                    <p class="admin-tarjeta-numero" id="total-productos">0</p>
                    <p class="admin-tarjeta-label">Productos registrados</p>
                </div>
                <div class="admin-tarjeta" data-solo-admin>
                    <p class="admin-tarjeta-numero" id="total-usuarios">0</p>
                    <p class="admin-tarjeta-label">Usuarios registrados</p>
                </div>
                <div class="admin-tarjeta">
                    <p class="admin-tarjeta-numero" id="total-stock-critico">0</p>
                    <p class="admin-tarjeta-label">Productos con stock crítico</p>
                </div>
            </div>

            <p style="font-family:'Roboto',sans-serif; opacity:0.7;">
                Usa el menú de la izquierda para gestionar productos y usuarios.
            </p>
        </div>
    </div>

    <script src="js/admin-auth.js"></script>
    <script src="js/admin-home.js"></script>
</body>
</html>
