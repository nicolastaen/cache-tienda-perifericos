<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Panel Caché</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <style>body{ margin-top: 0; }</style>
</head>
<body data-pagina-admin="usuarios">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-logo">
                <img src="../imagenes/Cachelogo.png" alt="logo">
                <span>Panel Caché</span>
            </div>

            <a href="index.html" class="admin-nav-link">🏠 Inicio</a>
            <a href="productos.html" class="admin-nav-link">📦 Productos</a>
            <a href="usuarios.html" class="admin-nav-link activo" data-solo-admin>👤 Usuarios</a>

            <a href="#" class="admin-nav-salir" id="btn-cerrar-sesion">↩ Cerrar sesión</a>
        </aside>

        <div class="admin-contenido">
            <div class="admin-header">
                <h1>Usuarios</h1>
                <button type="button" class="admin-btn-nuevo" id="btn-nuevo-usuario">+ Nuevo usuario</button>
            </div>

            <div class="admin-tabla-contenedor">
                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>RUN</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios-body">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-usuarios.js"></script>
</body>
</html>
